<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Ciceroo — UNILAG Admission Intelligence 2025/2026</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f9fc;
    --bg2: #ffffff;
    --bg3: #eef2f7;
    --card: #ffffff;
    --card2: #f0f4f8;
    --teal: #0d9e8a;
    --teal2: #0a7d6e;
    --teal-light: rgba(13,158,138,0.1);
    --orange: #e07b39;
    --dark: #0f1f2e;
    --text: #1a202c;
    --text2: #4a5568;
    --text3: #718096;
    --border: #e2e8f0;
    --border2: #cbd5e0;
    --green: #38a169;
    --red: #e53e3e;
    --gold: #d69e2e;
    --shadow: 0 2px 16px rgba(0,0,0,0.08);
    --shadow2: 0 4px 24px rgba(0,0,0,0.12);
    /* legacy aliases kept for JS-generated inline styles */
    --blue: #0d9e8a;
    --blue2: #0a7d6e;
    --purple: #6b46c1;
    --gold2: #ecc94b;
  }

  html { font-size: 16px; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.1rem 2rem;
    border-bottom: 1px solid var(--border);
    background: #ffffff;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 1px 8px rgba(0,0,0,0.06);
  }
  .brand { display: flex; align-items: center; gap: 0.75rem; }
  .brand-logo {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--teal), var(--teal2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; font-weight: 900; color: white;
  }
  .brand-text { display: flex; flex-direction: column; }
  .brand-name { font-size: 1.15rem; font-weight: 800; color: var(--dark); letter-spacing: -0.02em; }
  .brand-sub { font-size: 0.68rem; color: var(--text3); letter-spacing: 0.05em; text-transform: uppercase; }
  .unilag-badge {
    background: var(--teal-light);
    border: 1.5px solid rgba(13,158,138,0.25);
    padding: 0.35rem 0.9rem;
    border-radius: 999px;
    font-size: 0.75rem;
    color: var(--teal);
    font-weight: 700;
    letter-spacing: 0.03em;
  }

  /* PROGRESS */
  .progress-wrap {
    padding: 1.75rem 2rem 0.5rem;
    max-width: 760px; margin: 0 auto;
  }
  .progress-steps {
    display: flex; align-items: center; gap: 0; position: relative;
  }
  .step-node {
    display: flex; flex-direction: column; align-items: center; gap: 0.35rem;
    flex: 1; position: relative; cursor: default;
  }
  .step-circle {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 700;
    transition: all 0.3s ease;
    position: relative; z-index: 2;
    border: 2px solid var(--border2);
    background: #ffffff;
    color: var(--text3);
  }
  .step-node.active .step-circle {
    background: var(--teal);
    border-color: var(--teal);
    color: white;
    box-shadow: 0 0 0 4px rgba(13,158,138,0.18);
  }
  .step-node.done .step-circle {
    background: var(--teal);
    border-color: var(--teal);
    color: white;
  }
  .step-label {
    font-size: 0.65rem; color: var(--text3);
    text-align: center; white-space: nowrap;
    transition: color 0.3s;
    font-weight: 500;
  }
  .step-node.active .step-label { color: var(--teal); font-weight: 700; }
  .step-node.done .step-label { color: var(--teal2); }
  .step-line {
    flex: 1; height: 2px; background: var(--border);
    margin-bottom: 1.2rem; transition: background 0.3s;
    position: relative; z-index: 1;
  }
  .step-line.done { background: var(--teal); }

  /* MAIN CONTENT */
  .main {
    max-width: 760px; margin: 2rem auto;
    padding: 0 1rem 4rem;
  }

  /* CARDS */
  .step-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow);
    animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .card-header {
    padding: 1.5rem 1.75rem 1.25rem;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, var(--teal) 0%, var(--teal2) 100%);
  }
  .card-step-label {
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(255,255,255,0.75); margin-bottom: 0.35rem;
  }
  .card-title { font-size: 1.45rem; font-weight: 800; color: #ffffff; margin-bottom: 0.2rem; }
  .card-subtitle { font-size: 0.875rem; color: rgba(255,255,255,0.8); }
  .card-body { padding: 1.5rem 1.75rem; background: #ffffff; }

  /* INPUTS */
  .input-group { margin-bottom: 1.25rem; }
  .input-label {
    display: block; font-size: 0.8rem; font-weight: 600; color: var(--text2);
    margin-bottom: 0.45rem; letter-spacing: 0.02em;
  }
  .input-field {
    width: 100%; padding: 0.75rem 1rem;
    background: #ffffff; border: 1.5px solid var(--border);
    border-radius: 10px; color: var(--text);
    font-size: 0.95rem; transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  .input-field:focus {
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(13,158,138,0.12);
  }
  .input-field::placeholder { color: var(--text3); }
  select.input-field { cursor: pointer; }

  /* SEARCH */
  .search-wrap { position: relative; margin-bottom: 1rem; }
  .search-icon {
    position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
    color: var(--text3); font-size: 1rem; pointer-events: none;
  }
  .search-input {
    width: 100%; padding: 0.85rem 1rem 0.85rem 2.75rem;
    background: #ffffff; border: 1.5px solid var(--border);
    border-radius: 12px; color: var(--text);
    font-size: 1rem; transition: all 0.2s; outline: none;
  }
  .search-input:focus {
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(13,158,138,0.12);
  }
  .search-input::placeholder { color: var(--text3); }

  /* PROGRAMME LIST */
  .programme-list {
    max-height: 360px; overflow-y: auto;
    border: 1.5px solid var(--border); border-radius: 12px;
    background: #ffffff;
  }
  .programme-list::-webkit-scrollbar { width: 5px; }
  .programme-list::-webkit-scrollbar-track { background: transparent; }
  .programme-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  .programme-item {
    display: flex; align-items: center; gap: 0.85rem;
    padding: 0.85rem 1.1rem; cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s, border-left 0.15s;
    border-left: 3px solid transparent;
  }
  .programme-item:last-child { border-bottom: none; }
  .programme-item:hover { background: var(--teal-light); border-left-color: var(--teal); }
  .programme-item.selected { background: var(--teal-light); border-left-color: var(--teal); }
  .faculty-badge {
    font-size: 0.65rem; font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase; padding: 0.25rem 0.6rem;
    border-radius: 999px; white-space: nowrap; flex-shrink: 0;
  }
  .programme-name { font-size: 0.9rem; font-weight: 600; color: var(--text); }
  .programme-merit { font-size: 0.75rem; color: var(--text3); margin-left: auto; flex-shrink: 0; }

  /* UTME SECTION */
  .utme-score-display {
    background: var(--bg3); border: 1.5px solid var(--border);
    border-radius: 14px; padding: 1.5rem;
    text-align: center; margin-bottom: 1.5rem;
  }
  .utme-big { font-size: 3.5rem; font-weight: 900; color: var(--teal); line-height: 1; }
  .utme-unit { font-size: 0.85rem; color: var(--text3); margin-top: 0.25rem; }
  .score-bar-wrap { margin-top: 1.25rem; }
  .score-bar-label {
    display: flex; justify-content: space-between;
    font-size: 0.75rem; color: var(--text3); margin-bottom: 0.5rem;
  }
  .score-bar-track {
    height: 8px; background: var(--border2); border-radius: 4px; overflow: hidden;
  }
  .score-bar-fill {
    height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, var(--teal), var(--teal2));
    transition: width 0.4s ease;
  }

  /* O-LEVEL */
  .olevel-row {
    display: grid; grid-template-columns: 1fr auto auto;
    gap: 0.5rem; align-items: center; margin-bottom: 0.5rem;
  }
  .olevel-row-inner { display: grid; grid-template-columns: 2fr 1fr; gap: 0.5rem; }
  .btn-icon {
    width: 36px; height: 36px; border-radius: 8px; border: 1.5px solid var(--border);
    background: #ffffff; color: var(--text2); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; transition: all 0.15s;
    flex-shrink: 0;
  }
  .btn-icon:hover { background: var(--bg3); color: var(--text); }
  .btn-icon.danger:hover { background: rgba(229,62,62,0.08); border-color: var(--red); color: var(--red); }
  .add-subject-btn {
    display: flex; align-items: center; gap: 0.5rem;
    background: transparent; border: 1.5px dashed var(--border2);
    color: var(--text3); padding: 0.6rem 1rem; border-radius: 10px;
    cursor: pointer; font-size: 0.85rem; transition: all 0.15s;
    width: 100%; justify-content: center; margin-top: 0.5rem;
  }
  .add-subject-btn:hover { border-color: var(--teal); color: var(--teal); background: var(--teal-light); }

  /* OLEVEL RESULT */
  .olevel-result {
    background: var(--bg3); border: 1.5px solid var(--border);
    border-radius: 14px; padding: 1.25rem; margin-top: 1.25rem;
  }
  .olevel-result-title {
    font-size: 0.8rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text3); margin-bottom: 1rem;
  }
  .subject-chip {
    display: flex; align-items: center; justify-content: space-between;
    background: #ffffff; border: 1px solid var(--border);
    border-radius: 8px; padding: 0.6rem 0.85rem; margin-bottom: 0.4rem;
  }
  .subject-chip-name { font-size: 0.85rem; font-weight: 600; color: var(--text); }
  .subject-chip-grade { font-size: 0.75rem; color: var(--text3); }
  .subject-chip-pts {
    font-size: 0.85rem; font-weight: 700; color: var(--gold);
  }
  .result-total {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 0.75rem; margin-top: 0.5rem; border-top: 1px solid var(--border);
  }
  .result-total-label { font-size: 0.85rem; color: var(--text2); font-weight: 600; }
  .result-total-val { font-size: 1.1rem; font-weight: 800; color: var(--green); }

  .alert-box {
    background: rgba(229,62,62,0.06); border-left: 4px solid var(--red);
    border-radius: 8px; padding: 0.85rem 1rem;
    font-size: 0.85rem; color: #c53030; margin-top: 1rem;
    display: flex; gap: 0.6rem; align-items: flex-start;
    border-top: 1px solid rgba(229,62,62,0.15);
    border-right: 1px solid rgba(229,62,62,0.15);
    border-bottom: 1px solid rgba(229,62,62,0.15);
  }
  .alert-box.warn {
    background: rgba(224,123,57,0.06); border-left-color: var(--orange);
    color: #9c4221;
    border-top-color: rgba(224,123,57,0.15);
    border-right-color: rgba(224,123,57,0.15);
    border-bottom-color: rgba(224,123,57,0.15);
  }
  .alert-box.ok, .alert-box.success {
    background: rgba(56,161,105,0.06); border-left-color: var(--green);
    color: #276749;
    border-top-color: rgba(56,161,105,0.15);
    border-right-color: rgba(56,161,105,0.15);
    border-bottom-color: rgba(56,161,105,0.15);
  }

  /* POST UTME */
  .postutme-input-wrap { position: relative; }
  .postutme-suffix {
    position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
    font-size: 0.85rem; color: var(--text3); pointer-events: none;
  }
  .checkbox-row {
    display: flex; align-items: center; gap: 0.75rem;
    margin-top: 1rem; cursor: pointer; user-select: none;
  }
  .checkbox-box {
    width: 20px; height: 20px; border-radius: 6px;
    border: 2px solid var(--border2); background: #ffffff;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; flex-shrink: 0;
  }
  .checkbox-box.checked { background: var(--teal); border-color: var(--teal); }
  .checkbox-label { font-size: 0.875rem; color: var(--text2); }

  /* STATE SELECT */
  .state-select-wrap { margin-bottom: 1.5rem; }

  /* INFO BOX */
  .info-box {
    background: var(--teal-light); border-left: 4px solid var(--teal);
    border-radius: 8px; padding: 0.85rem 1rem; margin-bottom: 1.25rem;
    font-size: 0.82rem; color: var(--text2); line-height: 1.6;
    border-top: 1px solid rgba(13,158,138,0.15);
    border-right: 1px solid rgba(13,158,138,0.15);
    border-bottom: 1px solid rgba(13,158,138,0.15);
  }
  .info-box strong { color: var(--teal2); }

  /* RESULTS */
  .results-header {
    background: linear-gradient(135deg, var(--teal) 0%, var(--teal2) 100%);
    border-bottom: none;
    padding: 2rem 2rem 1.75rem;
    text-align: center;
  }
  .results-programme {
    font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: rgba(255,255,255,0.8); margin-bottom: 0.4rem;
  }
  .results-name { font-size: 1.75rem; font-weight: 900; color: #ffffff; margin-bottom: 0.25rem; }
  .results-faculty { font-size: 0.875rem; color: rgba(255,255,255,0.75); }

  .verdict-badge {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.55rem 1.5rem; border-radius: 999px;
    font-size: 0.9rem; font-weight: 800; letter-spacing: 0.04em;
    text-transform: uppercase; margin-top: 1.25rem;
    color: white;
  }
  .verdict-eligible { background: var(--green); }
  .verdict-borderline { background: var(--orange); }
  .verdict-not { background: var(--red); }

  .aggregate-display {
    text-align: center; margin: 1.5rem 0;
  }
  .aggregate-num { font-size: 4rem; font-weight: 900; line-height: 1; color: var(--teal); }
  .aggregate-denom { font-size: 1.5rem; color: var(--text3); font-weight: 400; }
  .aggregate-label { font-size: 0.8rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 0.25rem; }

  /* BREAKDOWN BAR */
  .breakdown-section { padding: 0 1.75rem 1.5rem; }
  .breakdown-bar-wrap {
    background: var(--bg3); border-radius: 10px; overflow: hidden;
    height: 36px; display: flex; margin-bottom: 0.75rem;
  }
  .breakdown-seg {
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; font-weight: 700; color: white;
    transition: width 0.6s ease; white-space: nowrap;
    overflow: hidden;
  }
  .seg-utme { background: linear-gradient(135deg, #3182ce, #2b6cb0); }
  .seg-olevel { background: linear-gradient(135deg, #6b46c1, #553c9a); }
  .seg-postutme { background: linear-gradient(135deg, var(--gold), #b7791f); }

  .breakdown-legend {
    display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem;
  }
  .legend-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; color: var(--text2); }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  /* CUTOFF TABLE */
  .cutoff-section { padding: 0 1.75rem 1.5rem; }
  .cutoff-title {
    font-size: 0.8rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text3); margin-bottom: 0.75rem;
  }
  .cutoff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .cutoff-item {
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 10px; padding: 0.85rem 1rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  .cutoff-item.highlight {
    border-color: var(--teal);
    background: var(--teal-light);
  }
  .cutoff-item-label { font-size: 0.8rem; color: var(--text2); }
  .cutoff-item-val { font-size: 0.95rem; font-weight: 700; }
  .cutoff-pass { color: var(--green); }
  .cutoff-fail { color: var(--red); }
  .cutoff-near { color: var(--gold); }

  /* SUBJECTS RESULT */
  .subjects-section { padding: 0 1.75rem 1.5rem; }

  /* BUTTONS */
  .btn-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 1.25rem 1.75rem;
    border-top: 1px solid var(--border);
    background: #ffffff;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.75rem 2rem; border-radius: 999px;
    font-size: 0.875rem; font-weight: 700; cursor: pointer;
    border: none; transition: all 0.2s; text-decoration: none;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .btn-primary {
    background: var(--teal);
    color: white;
    box-shadow: 0 2px 12px rgba(13,158,138,0.3);
  }
  .btn-primary:hover {
    background: var(--teal2);
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(13,158,138,0.4);
  }
  .btn-secondary {
    background: #ffffff; border: 2px solid var(--teal);
    color: var(--teal);
  }
  .btn-secondary:hover { background: var(--teal-light); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
  .btn-ghost { background: transparent; color: var(--teal); border: none; padding: 0.75rem 0; }
  .btn-ghost:hover { color: var(--teal2); }

  /* RESET */
  .btn-restart {
    background: #ffffff; border: 2px solid var(--teal);
    color: var(--teal);
  }
  .btn-restart:hover {
    background: var(--teal-light);
    transform: translateY(-1px);
  }

  /* DIVIDER */
  .divider { height: 1px; background: var(--border); margin: 1.25rem 0; }

  /* TAGS */
  .tag {
    display: inline-block; padding: 0.2rem 0.6rem;
    border-radius: 6px; font-size: 0.7rem; font-weight: 600;
  }

  /* DISCLAIMER */
  .disclaimer {
    font-size: 0.75rem; color: var(--text3); text-align: center;
    padding: 1rem 1.75rem; line-height: 1.6;
    background: #ffffff;
  }

  /* SELECTED PROGRAMME CHIP */
  .selected-prog-chip {
    display: flex; align-items: center; gap: 0.75rem;
    background: var(--teal-light); border: 1.5px solid rgba(13,158,138,0.25);
    border-radius: 10px; padding: 0.75rem 1rem; margin-bottom: 1.5rem;
  }
  .selected-prog-chip-name { font-size: 0.9rem; font-weight: 700; color: var(--text); }
  .selected-prog-chip-fac { font-size: 0.75rem; color: var(--teal); }

  /* POST-UTME TARGET BOX */
  .target-box {
    border-radius: 14px; padding: 1.25rem 1.5rem; margin: 0 0 1.25rem;
    display: flex; align-items: center; gap: 1.25rem;
    border: 1.5px solid;
  }
  .target-box.achievable { background: rgba(56,161,105,0.06); border-color: rgba(56,161,105,0.3); }
  .target-box.stretch { background: rgba(224,123,57,0.06); border-color: rgba(224,123,57,0.3); }
  .target-box.impossible { background: rgba(229,62,62,0.06); border-color: rgba(229,62,62,0.25); }
  .target-icon { font-size: 2rem; flex-shrink: 0; }
  .target-score { font-size: 2.25rem; font-weight: 900; line-height: 1; }
  .target-score.achievable { color: var(--green); }
  .target-score.stretch { color: var(--orange); }
  .target-score.impossible { color: var(--red); }
  .target-label { font-size: 0.78rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.07em; margin-top: 0.2rem; }
  .target-desc { font-size: 0.85rem; color: var(--text2); line-height: 1.5; }

  /* ALTERNATIVES PANEL */
  .alt-panel { padding: 0 0 1.5rem; }
  .alt-panel-title {
    font-size: 1rem; font-weight: 700; color: var(--text);
    margin: 1.5rem 0 0.25rem; padding: 0 0 0.75rem;
    border-bottom: 1px solid var(--border);
  }
  .alt-panel-sub { font-size: 0.8rem; color: var(--text3); margin-bottom: 1rem; }
  .alt-faculty-group { margin-bottom: 1.5rem; }
  .alt-faculty-name {
    font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text3); margin-bottom: 0.5rem; padding: 0.3rem 0;
    border-bottom: 1px solid var(--border);
  }
  .alt-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.65rem 0.85rem; border-radius: 10px; margin-bottom: 0.4rem;
    background: #ffffff; border: 1px solid var(--border);
    cursor: pointer; transition: border-color .15s, background .15s, box-shadow .15s;
  }

// ============================================================
// ALGORITHM: findBestFive
// ============================================================

function findBestFive(studentResults, requirements) {
  // studentResults: [{subject: string, grade: string, points: number}]
  // requirements: [{label, subjects, count}]
  // Returns {valid, selected, totalPoints, error, usedByGroup}

  const validResults = studentResults.filter(r => r.points > 0);
  const used = new Set(); // indices of studentResults already assigned
  const selected = [];
  const usedByGroup = [];

  for (const group of requirements) {
    let candidates;

    if (group.subjects.includes("__ANY__")) {
      // Any valid subject not already used
      candidates = validResults
        .filter((r, i) => !used.has(i))
        .map((r, _) => ({...r, origIdx: studentResults.indexOf(r)}));
    } else {
      candidates = validResults
        .filter((r, i) => group.subjects.includes(r.subject) && !used.has(studentResults.indexOf(r)))
        .map(r => ({...r, origIdx: studentResults.indexOf(r)}));
    }

    // sort by points descending
    candidates.sort((a, b) => b.points - a.points);
    const picked = candidates.slice(0, group.count);

    if (picked.length < group.count) {
      return {
        valid: false,
        error: `Missing required subject for: "${group.label}". You need ${group.count} subject(s) from [${group.subjects.join(", ")}] but only found ${picked.length} passing grade(s).`
      };
    }

    picked.forEach(p => used.add(p.origIdx));
    selected.push(...picked);
    usedByGroup.push({groupLabel: group.label, subjects: picked});
  }

  const totalPoints = selected.reduce((s, r) => s + r.points, 0);
  return {valid: true, selected, totalPoints, usedByGroup};
}

// ============================================================
// ALGORITHM: checkUTMESubjects
// ============================================================

function checkUTMESubjects(studentSubjects, utmeReqs) {
  // studentSubjects: array of 4 subject name strings (non-empty)
  // utmeReqs: [{subjects, count}] groups — same structure as O/Level requirements
  // Returns {valid: bool, missing: string[]}
  if (!utmeReqs || utmeReqs.length === 0) return {valid: true, missing: []};

  const available = [...studentSubjects.filter(s => s)];
  const used = new Set();
  const missing = [];

  for (const group of utmeReqs) {
    let filled = 0;
    const needed = group.count;

    if (group.subjects.includes("__ANY__")) {
      // Any unused subject counts
      for (let i = 0; i < available.length && filled < needed; i++) {
        if (!used.has(i)) { used.add(i); filled++; }
      }
    } else {
      for (let i = 0; i < available.length && filled < needed; i++) {
        if (!used.has(i) && group.subjects.includes(available[i])) {
          used.add(i); filled++;
        }
      }
    }

    if (filled < needed) {
      const shortfall = needed - filled;
      const opts = group.subjects.includes("__ANY__") ? "any subject" : group.subjects.join(" / ");
      missing.push(`${shortfall} of: ${opts}`);
    }
  }

  return {valid: missing.length === 0, missing};
}

// ============================================================
// ALTERNATIVE PROGRAMME FINDER
// ============================================================

function findAlternativeProgrammes(studentResults) {
  const utme = parseFloat(state.utmeScore) || 0;
  const utmePts = Math.min(utme / 8, 50);
  const results = [];

  for (const prog of PROGRAMMES) {
    // Skip the currently chosen programme
    if (state.programme && prog.name === state.programme.name) continue;
    const res = findBestFive(studentResults, prog.requirements);
    if (!res.valid) continue;

    // Also check UTME subject compatibility if student has entered subjects
    const filledUtme = state.utmeSubjects.filter(s => s);
    if (filledUtme.length >= 3 && prog.utmeReqs) {
      const utmeOk = checkUTMESubjects(state.utmeSubjects, prog.utmeReqs);
      if (!utmeOk.valid) continue;
    }

    const olevelPts = res.totalPoints;
    // Estimate aggregate assuming they score 75% on Post-UTME (22.5)
    const estimatedAggregate = utmePts + olevelPts + 22.5;
    const merit = prog.merit;

    let chance = "low";
    if (merit === 0) { chance = "med"; }
    else if (estimatedAggregate >= merit) { chance = "high"; }
    else if (estimatedAggregate >= merit - 5) { chance = "med"; }

    results.push({ prog, olevelPts, estimatedAggregate, chance });
  }

  // Group by faculty, sort within faculty by chance desc then merit asc
  const grouped = {};
  for (const r of results) {
    const fac = r.prog.faculty;
    if (!grouped[fac]) grouped[fac] = [];
    grouped[fac].push(r);
  }

  // Sort within each faculty: high chance first, then by estimated aggregate desc
  const chanceOrder = { high: 0, med: 1, low: 2 };
  for (const fac of Object.keys(grouped)) {
    grouped[fac].sort((a, b) =>
      chanceOrder[a.chance] - chanceOrder[b.chance] ||
      b.estimatedAggregate - a.estimatedAggregate
    );
  }

  // Sort faculties by number of high-chance programmes desc
  const sortedFaculties = Object.keys(grouped).sort((a, b) => {
    const aHigh = grouped[a].filter(r => r.chance === "high").length;
    const bHigh = grouped[b].filter(r => r.chance === "high").length;
    return bHigh - aHigh;
  });

  return { grouped, sortedFaculties };
}

function renderAlternatives(studentResults) {
  const { grouped, sortedFaculties } = findAlternativeProgrammes(studentResults);
  const utme = parseFloat(state.utmeScore) || 0;

  if (sortedFaculties.length === 0) {
    return `<div class="alt-panel">
      <div class="alt-panel-title">🔍 Alternative Programmes</div>
      <div class="alert-box warn">No matching programmes found for your current O/Level combination. Try updating your subjects.</div>
    </div>`;
  }

  const total = sortedFaculties.reduce((s, f) => s + grouped[f].length, 0);
  let html = `<div class="alt-panel">
    <div class="alt-panel-title">💡 ${total} Programmes You May Qualify For</div>
    <div class="alt-panel-sub">Based on your O/Level subjects${utme > 0 ? ` and UTME score of ${utme}` : ""}${state.utmeSubjects.filter(s=>s).length >= 3 ? " and UTME subject combination" : ""}. Chance rating assumes ~75% Post-UTME score. Click a programme to switch your selection.</div>`;

  for (const fac of sortedFaculties) {
    const items = grouped[fac];
    html += `<div class="alt-faculty-group">
      <div class="alt-faculty-name">${fac}</div>`;

    for (const { prog, olevelPts, estimatedAggregate, chance } of items) {
      const chanceLabel = chance === "high" ? "High Chance" : chance === "med" ? "Moderate" : "Low Chance";
      const meritStr = prog.merit > 0 ? `Merit: ${prog.merit}` : "No cut-off data";
      html += `<div class="alt-item" onclick="switchToProgramme('${prog.name.replace(/'/g,"\\'")}')">
        <div>
          <div class="alt-item-name">${prog.name}</div>
          <div class="alt-item-pts">O/Level: ${olevelPts.toFixed(1)}/20 pts &nbsp;·&nbsp; Est. Aggregate: ${estimatedAggregate.toFixed(1)}</div>
        </div>
        <div class="alt-item-right">
          <span class="chance-pill chance-${chance}">${chanceLabel}</span>
          <span class="alt-cutoff">${meritStr}</span>
          <span class="alt-switch-btn">Switch →</span>
        </div>
      </div>`;
    }
    html += `</div>`;
  }

  html += `</div>`;
  return html;
}

window.switchToProgramme = function(name) {
  const prog = PROGRAMMES.find(p => p.name === name);
  if (!prog) return;
  state.programme = prog;
  // Recompute olevel for new programme
  const res = computeOlevelResult();
  if (res && res.valid) {
    state.olevelResult = res;
  }
  render();
};

            <div class="score-bar-fill" id="utmeBar" style="width:${pct}%"></div>
          </div>
        </div>
      </div>
      <div class="input-group">
        <label class="input-label">Your UTME Score</label>
        <input class="input-field" type="number" id="utmeInput" min="0" max="400" placeholder="e.g. 280" value="${state.utmeScore}">
      </div>
      <div style="margin-top:1.25rem">
        <label class="input-label" style="margin-bottom:0.5rem;display:block">Your 4 UTME Subjects</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem" id="utmeSubjRows">
          ${subjectRows}
        </div>
      </div>
      <div id="utmeCheckBox" style="margin-top:0.75rem">${utmeCheck}</div>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="step2Back">← Back</button>
      <button class="btn btn-primary" id="step2Next" ${score > 0 ? "" : "disabled"}>Continue →</button>
    </div>
  </div>`;
  document.getElementById("mainContent").innerHTML = html;

  document.getElementById("utmeInput").addEventListener("input", function() {
    let v = Math.max(0, Math.min(400, parseInt(this.value) || 0));
    state.utmeScore = v;
    document.getElementById("utmeBig").textContent = v || "—";
    const c = Math.min(v / 8, 50).toFixed(2);
    document.getElementById("utmeContrib").textContent = `${c} / 50 points`;
    const p = Math.min((v / 400) * 100, 100);
    document.getElementById("utmeBar").style.width = p + "%";
    document.getElementById("step2Next").disabled = v === 0;
  });
  document.getElementById("step2Back").addEventListener("click", () => { state.step = 1; render(); });
  document.getElementById("step2Next").addEventListener("click", () => {
    const v = parseInt(document.getElementById("utmeInput").value) || 0;
    if (v > 0) { state.utmeScore = v; state.step = 3; render(); }
  });
}

window.updateUTMESubject = function(i, value) {
  state.utmeSubjects[i] = value;
  document.getElementById("utmeCheckBox").innerHTML = renderUTMECheck();
};

function renderUTMECheck() {
  const prog = state.programme;
  if (!prog || !prog.utmeReqs) return "";
  const filled = state.utmeSubjects.filter(s => s);
  if (filled.length === 0) return `<div class="info-box" style="font-size:0.82rem">Select your 4 UTME subjects above to check compatibility with <strong>${prog.name}</strong>.</div>`;

  const result = checkUTMESubjects(state.utmeSubjects, prog.utmeReqs);
  if (result.valid) {
    return `<div class="alert-box ok" style="font-size:0.85rem">
      ✅ Your UTME subjects are compatible with <strong>${prog.name}</strong>.
    </div>`;
  } else {
    return `<div class="alert-box warn" style="font-size:0.85rem">
      ⚠️ <strong>${prog.name}</strong> requires different UTME subjects. Missing: ${result.missing.join("; ")}.<br>
      <span style="color:var(--text2)">Continue entering your details — the results page will show all programmes that match your exact UTME and O/Level combination.</span>
    </div>`;
  }
}

function findUTMECompatibleProgrammes(subjects) {
  const filled = subjects.filter(s => s);
  if (filled.length < 2) return {grouped: {}, sortedFaculties: [], total: 0};

  const grouped = {};
  let total = 0;
  for (const p of PROGRAMMES) {
    if (state.programme && p.name === state.programme.name) continue;
    if (!p.utmeReqs) continue;
    const res = checkUTMESubjects(subjects, p.utmeReqs);
    if (!res.valid) continue;
    if (!grouped[p.faculty]) grouped[p.faculty] = [];
    grouped[p.faculty].push(p);
    total++;
  }

  const sortedFaculties = Object.keys(grouped).sort((a, b) =>
    grouped[b].length - grouped[a].length
  );
  return {grouped, sortedFaculties, total};
}

function renderOlevelRows() {
  return state.olevel.map((row, i) => `
    <div class="olevel-row" id="orow-${i}">
      <div class="olevel-row-inner">
        <select class="input-field" id="osubj-${i}" onchange="updateOlevelRow(${i},'subject',this.value)">
          <option value="">— Select subject —</option>
          ${subjectOpts(row.subject)}
        </select>
        <select class="input-field" id="ograde-${i}" onchange="updateOlevelRow(${i},'grade',this.value)">
          <option value="">Grade</option>
          ${gradeOpts(row.grade)}
        </select>
      </div>
      ${state.olevel.length > 5 ? `<button class="btn-icon danger" onclick="removeOlevelRow(${i})" title="Remove">✕</button>` : `<div style="width:36px"></div>`}
    </div>`).join("");
}

function bindOlevelEvents() {
  const addBtn = document.getElementById("addSubjectBtn");
  if (addBtn) addBtn.addEventListener("click", () => {
    if (state.olevel.length < 9) {
      state.olevel.push({subject: "", grade: ""});
      document.getElementById("olevelRows").innerHTML = renderOlevelRows();
      addBtn.disabled = state.olevel.length >= 9;
      updateOlevelResult();
    }
  });
}

window.updateOlevelRow = function(i, key, val) {
  if (key === "subject") {
    state.olevel[i].subject = normalizeSubject(val);
  } else {
    state.olevel[i].grade = val;
  }
  updateOlevelResult();
};

window.removeOlevelRow = function(i) {
  state.olevel.splice(i, 1);
  document.getElementById("olevelRows").innerHTML = renderOlevelRows();
  const addBtn = document.getElementById("addSubjectBtn");
  if (addBtn) addBtn.disabled = state.olevel.length >= 9;
  updateOlevelResult();
};

function getStudentResults() {
  return state.olevel
    .filter(r => r.subject && r.grade)
    .map(r => ({
      subject: r.subject,
      grade: r.grade,
      points: gradeToPoints(r.grade)
    }));
}

function computeOlevelResult() {
  if (!state.programme) return null;
  const results = getStudentResults();
  if (results.length < 5) return null;
  return findBestFive(results, state.programme.requirements);
}

function updateOlevelResult() {
  const box = document.getElementById("olevelResultBox");
  if (!box) return;
  const res = computeOlevelResult();
  const studentResults = getStudentResults();

  if (!res) {
    box.innerHTML = `<div class="alert-box warn" style="margin-top:1rem">⚠ Enter at least 5 subjects with grades to see your O/Level analysis.</div>`;
    return;
  }
  if (!res.valid) {
    const altHtml = studentResults.length >= 5 ? renderAlternatives(studentResults) : "";
    box.innerHTML = `
      <div class="alert-box" style="margin-top:1rem">
        ❌ <strong>Your O/Level combination does not satisfy ${state.programme ? state.programme.name : "this programme"} requirements.</strong><br/>
        <span style="font-size:0.85rem;color:var(--text2);margin-top:0.35rem;display:block">${res.error}</span>
      </div>
      ${altHtml}`;
    return;
  }
  const chips = res.selected.map(s => `
    <div class="subject-chip">
      <div>
        <div class="subject-chip-name">${s.subject}</div>
        <div class="subject-chip-grade">${s.grade}</div>
      </div>
      <div class="subject-chip-pts">${s.points.toFixed(1)}</div>
    </div>`).join("");
  box.innerHTML = `
    <div class="olevel-result">
      <div class="olevel-result-title">Best 5 Selected for ${state.programme.name}</div>
      ${chips}
      <div class="result-total">
        <span class="result-total-label">Total O/Level Score</span>
        <span class="result-total-val">${res.totalPoints.toFixed(2)} / 20</span>
      </div>
    </div>`;
}

function renderStep5() {
  const prog = state.programme;
  const utme = parseFloat(state.utmeScore) || 0;
  const utmeContrib = Math.min(utme / 8, 50);
  const olevelContrib = state.olevelResult ? state.olevelResult.totalPoints : 0;
  const postUtmeRaw = state.postUtmeUnknown ? 0 : parseFloat(state.postUtme) || 0;
  const postUtmeContrib = Math.min(postUtmeRaw, 30);
  const total = utmeContrib + olevelContrib + postUtmeContrib;

  // Verdict
  let verdict, verdictClass, verdictIcon;
  const merit = prog.merit;
  const catchmentScore = state.state && state.state !== "Other" ? prog.catchment[state.state] : null;
  const relevantCutoff = catchmentScore !== undefined ? Math.min(merit, catchmentScore) : merit;

  if (state.postUtmeUnknown) {
    verdict = "PRE-EXAM PROJECTION";
    verdictClass = "verdict-borderline";
    verdictIcon = "🎯";
  } else if (merit === 0) {
    verdict = "NO CUTOFF DATA";
    verdictClass = "verdict-borderline";
    verdictIcon = "📊";
  } else if (total >= merit) {
    verdict = "ELIGIBLE (MERIT)";
    verdictClass = "verdict-eligible";
    verdictIcon = "✓";
  } else if (catchmentScore !== undefined && total >= catchmentScore) {
    verdict = "ELIGIBLE (CATCHMENT)";
    verdictClass = "verdict-eligible";
    verdictIcon = "✓";
  } else if (total >= (relevantCutoff - 3)) {
    verdict = "BORDERLINE";
    verdictClass = "verdict-borderline";
    verdictIcon = "~";
  } else {
    verdict = "NOT ELIGIBLE";
    verdictClass = "verdict-not";
    verdictIcon = "✕";
  }

  // Aggregate colour
  const aggColor = total >= merit ? "var(--green)" : total >= (merit - 5) ? "var(--gold)" : "var(--red)";

  // breakdown bar widths
  const utmePct = (utmeContrib / 100) * 100;
  const olevPct = (olevelContrib / 100) * 100;
  const postPct = (postUtmeContrib / 100) * 100;

  // cutoff items
  let cutoffHtml = "";
  if (merit === 0) {
    cutoffHtml = `<div class="alert-box warn">ℹ No official cut-off data is available for this programme.</div>`;
  } else {
    const meritPass = total >= merit;
    cutoffHtml = `<div class="cutoff-grid">
      <div class="cutoff-item">
        <span class="cutoff-item-label">Merit Cut-off</span>
        <span class="cutoff-item-val ${meritPass ? "cutoff-pass" : "cutoff-fail"}">${merit}</span>
      </div>
      <div class="cutoff-item ${Math.abs(total - merit) <= 3 ? "highlight" : ""}">
        <span class="cutoff-item-label">Your Aggregate</span>
        <span class="cutoff-item-val" style="color:${aggColor}">${total.toFixed(3)}</span>
      </div>`;
    if (catchmentScore !== undefined) {
      const catchPass = total >= catchmentScore;
      cutoffHtml += `
      <div class="cutoff-item">
        <span class="cutoff-item-label">${state.state} Catchment</span>
        <span class="cutoff-item-val ${catchPass ? "cutoff-pass" : "cutoff-fail"}">${catchmentScore}</span>
      </div>
      <div class="cutoff-item">
        <span class="cutoff-item-label">Gap to Catchment</span>
        <span class="cutoff-item-val ${catchPass ? "cutoff-pass" : "cutoff-near"}">${(total - catchmentScore).toFixed(3)}</span>
      </div>`;
    } else {
      cutoffHtml += `
      <div class="cutoff-item">
        <span class="cutoff-item-label">${state.state === "Other" ? "Other State" : state.state}</span>
        <span class="cutoff-item-val" style="color:var(--text3)">No catchment data</span>
      </div>
      <div class="cutoff-item">
        <span class="cutoff-item-label">Gap to Merit</span>
        <span class="cutoff-item-val ${meritPass ? "cutoff-pass" : "cutoff-near"}">${(total - merit).toFixed(3)}</span>
      </div>`;
    }
    cutoffHtml += `</div>`;
  }

  // Selected subjects
  const subjectChips = state.olevelResult.selected.map(s => `
    <div class="subject-chip">
      <div><div class="subject-chip-name">${s.subject}</div><div class="subject-chip-grade">${s.grade}</div></div>
      <div class="subject-chip-pts">${s.points.toFixed(1)}</div>
    </div>`).join("");

  // --- POST-UTME TARGET CALCULATION ---
  // How much does the student need in Post-UTME to hit the relevant cut-off?
  const scored = utmeContrib + olevelContrib; // known, fixed
  let targetHtml = "";
  if (merit > 0) {
    const targetMerit = merit - scored;
    const targetCatch = (catchmentScore !== undefined) ? catchmentScore - scored : null;

    // Pick the more achievable target (catchment if lower and available)
    const primaryTarget = (targetCatch !== null && targetCatch < targetMerit) ? targetCatch : targetMerit;
    const primaryLabel = (targetCatch !== null && targetCatch < targetMerit)
      ? `${state.state} Catchment (${catchmentScore})` : `Merit (${merit})`;

    let tClass, tIcon, tDesc;
    if (primaryTarget <= 0) {
      tClass = "achievable"; tIcon = "🏆";
      tDesc = `You <strong>already qualify</strong> for ${primaryLabel} based on your UTME + O/Level scores alone — even before Post-UTME!`;
    } else if (primaryTarget <= 30) {
      tClass = primaryTarget <= 22 ? "achievable" : "stretch";
      tIcon = primaryTarget <= 22 ? "🎯" : "⚡";
      const pct = Math.round((primaryTarget / 30) * 100);
      const difficulty = primaryTarget <= 15 ? "Very achievable with solid preparation." : primaryTarget <= 22 ? "Achievable — aim for consistent study." : "Challenging — you need a strong performance.";
      tDesc = state.postUtmeUnknown
        ? `To secure admission to <strong>${prog.name}</strong>, score at least <strong>${Math.max(0, primaryTarget).toFixed(1)}/30</strong> in the Post-UTME. That's <strong>${pct}%</strong> of the maximum. ${difficulty}`
        : `This is <strong>${pct}% of the maximum</strong> Post-UTME score. ${primaryTarget <= 22 ? "This is very achievable with solid preparation." : "Aim high — you'll need a strong performance in the Post-UTME."}`;
    } else {
      tClass = "impossible"; tIcon = "⚠️";
      tDesc = `Even with a perfect Post-UTME score (30/30), your aggregate would only reach <strong>${(scored + 30).toFixed(2)}</strong> — still ${(merit - scored - 30).toFixed(2)} below the merit cut-off. Consider improving your UTME score or exploring alternative programmes.`;
    }

    const targetSectionTitle = state.postUtmeUnknown
      ? "🎯 Your Post-UTME Target — What You Need to Score"
      : "🎯 Post-UTME Target — What You Need";

    targetHtml = `
    <div class="breakdown-section" style="padding-top:0">
      <div style="font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text3);margin-bottom:0.75rem">
        ${targetSectionTitle}
      </div>
      <div class="target-box ${tClass}">
        <div class="target-icon">${tIcon}</div>
        <div>
          <div style="display:flex;align-items:baseline;gap:0.5rem">
            <div class="target-score ${tClass}">${primaryTarget <= 0 ? "0" : Math.max(0, primaryTarget).toFixed(2)}</div>
            <div style="font-size:1rem;color:var(--text3);font-weight:400">/ 30</div>
          </div>
          <div class="target-label">Needed for ${primaryLabel}</div>
          <div class="target-desc" style="margin-top:0.4rem">${tDesc}</div>
        </div>
      </div>
      ${targetCatch !== null && targetCatch !== primaryTarget ? `
      <div style="font-size:0.8rem;color:var(--text3);margin-top:0.5rem">
        Also: need <strong style="color:var(--text2)">${Math.max(0, targetMerit).toFixed(2)}/30</strong> for national merit qualification.
      </div>` : ""}
    </div>`;
  }

  // Advice
  let advice = "";
  if (merit === 0) {
    advice = "Contact UNILAG admissions for current cut-off information for this programme.";
  } else if (total >= merit) {
    advice = "Excellent! Your aggregate meets the merit cut-off. Ensure all documents are ready and monitor the UNILAG admissions portal.";
  } else if (catchmentScore !== undefined && total >= catchmentScore) {
    advice = `Your aggregate qualifies under the ${state.state} catchment quota. Monitor the admissions portal and submit all required documents promptly.`;
  } else if (total >= (relevantCutoff - 3)) {
    advice = `You're very close to the cut-off. Consider uploading supplementary credentials, check if your state has catchment benefits, and watch for changes in the cut-off.`;
  } else {
    const gap = (relevantCutoff - total).toFixed(3);
    advice = `Your aggregate is ${gap} points below the cut-off. Consider improving your UTME score in a resit, or explore other programmes where your aggregate is competitive.`;
  }

  // --- ALTERNATIVES (always shown — filtered by UTME + O/Level compatibility) ---
  let altHtml = "";
  const studentResults = getStudentResults();
  if (studentResults.length >= 5) {
    altHtml = `<div class="breakdown-section" style="padding-top:0">${renderAlternatives(studentResults)}</div>`;
  }

  const postUtmeNote = state.postUtmeUnknown ? ` <span style="color:var(--text3);font-size:0.75rem">(not yet taken)</span>` : "";

  const html = `
  <div class="step-card">
    <div class="results-header">
      <div class="results-programme">${prog.faculty}</div>
      <div class="results-name">${prog.name}</div>
      <div class="results-faculty">2025/2026 Admissions — UNILAG</div>
      <div class="verdict-badge ${verdictClass}">${verdictIcon} ${verdict}</div>
    </div>

    <div class="aggregate-display">
      <div style="margin-top:1.5rem">
        <span class="aggregate-num" style="color:${aggColor}">${total.toFixed(3)}</span>
        <span class="aggregate-denom"> / 100</span>
      </div>
      <div class="aggregate-label">Total Aggregate Score</div>
    </div>

    <div class="breakdown-section">
      <div style="font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text3);margin-bottom:0.75rem">Score Breakdown</div>
      <div class="breakdown-bar-wrap">
        <div class="breakdown-seg seg-utme" style="width:${utmePct}%" title="UTME: ${utmeContrib.toFixed(2)}">
          ${utmeContrib > 5 ? utmeContrib.toFixed(1) : ""}
        </div>
        <div class="breakdown-seg seg-olevel" style="width:${olevPct}%" title="O/Level: ${olevelContrib.toFixed(2)}">
          ${olevelContrib > 2 ? olevelContrib.toFixed(1) : ""}
        </div>
        <div class="breakdown-seg seg-postutme" style="width:${postPct}%" title="Post-UTME: ${postUtmeContrib.toFixed(2)}">
          ${postUtmeContrib > 2 ? postUtmeContrib.toFixed(1) : ""}
        </div>
      </div>
      <div class="breakdown-legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div>UTME: ${utmeContrib.toFixed(2)} / 50</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--purple)"></div>O/Level: ${olevelContrib.toFixed(2)} / 20</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--gold)"></div>Post-UTME: ${postUtmeContrib.toFixed(2)} / 30${postUtmeNote}</div>
      </div>
    </div>

    ${targetHtml}

    <div class="cutoff-section">
      <div class="cutoff-title">Cut-off Analysis</div>
      ${cutoffHtml}
    </div>

    <div class="subjects-section">
      <div class="cutoff-title">O/Level Subjects Selected (Best 5)</div>
      ${subjectChips}
    </div>

    <div class="subjects-section">
      <div class="cutoff-title">Required UTME Subjects</div>
      <div style="display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:0.5rem">
        ${prog.utme.map(s => `<span class="tag" style="background:rgba(37,99,235,0.15);color:var(--blue2)">${s}</span>`).join("")}
      </div>
    </div>

    <div class="subjects-section">
      <div class="info-box">${advice}</div>
    </div>

    ${altHtml}

    <div class="btn-row">
      <button class="btn btn-secondary" id="step5Back">← Edit</button>
      <button class="btn btn-restart" id="step5Restart">↺ Start Over</button>
    </div>
    <div class="disclaimer">
      This tool is for estimation purposes only. Actual cut-off marks may vary. Always verify with the official UNILAG admissions portal at unilag.edu.ng. Cut-off data is based on 2024/2025 figures as reference.
    </div>
  </div>`;
  document.getElementById("mainContent").innerHTML = html;

  document.getElementById("step5Back").addEventListener("click", () => { state.step = 4; render(); });
  document.getElementById("step5Restart").addEventListener("click", () => {
    state.step = 1;
    state.programme = null;
    state.utmeScore = "";
    state.olevel = [{subject:"",grade:""},{subject:"",grade:""},{subject:"",grade:""},{subject:"",grade:""},{subject:"",grade:""}];
    state.postUtme = "";
    state.postUtmeUnknown = false;
    state.state = "";
    state.olevelResult = null;
    render();
  });
}

// ============================================================
// MAIN RENDER
// ============================================================

function render() {
  renderProgress();
  window.scrollTo(0, 0);
  switch (state.step) {
    case 1: renderStep1(); break;
    case 2: renderStep2(); break;
    case 3: renderStep3(); break;
    case 4: renderStep4(); break;
    case 5: renderStep5(); break;
  }
}

render();
</script>
</body>
</html>
