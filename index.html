<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>UNILAG Admission Guide — Ciceroo</title>
<style>
  :root{
    --bg:#0a0e1a;
    --surface:#111827;
    --surface2:#1a2235;
    --border:#1e2d45;
    --accent:#3b82f6;
    --accent2:#6366f1;
    --gold:#f59e0b;
    --green:#10b981;
    --red:#ef4444;
    --text:#e2e8f0;
    --muted:#94a3b8;
    --card:#151e2e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}

  /* HERO */
  #hero{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;padding:2rem;text-align:center;
    background:radial-gradient(ellipse at top,#0d1b40 0%,#0a0e1a 60%);
    position:relative;overflow:hidden;
  }
  #hero::before{
    content:'';position:absolute;inset:0;
    background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%231e2d45' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    opacity:0.5;
  }
  .hero-logo{
    width:90px;height:90px;border-radius:50%;
    border:3px solid var(--gold);
    background:linear-gradient(135deg,#1e3a6e,#0d1b40);
    display:flex;align-items:center;justify-content:center;
    font-size:2.5rem;margin-bottom:1.5rem;
    box-shadow:0 0 40px rgba(245,158,11,.3);
    animation:pulse 3s infinite;
  }
  @keyframes pulse{0%,100%{box-shadow:0 0 40px rgba(245,158,11,.3)}50%{box-shadow:0 0 60px rgba(245,158,11,.5)}}
  .hero-badge{
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#fff;font-size:.75rem;font-weight:700;letter-spacing:.15em;
    text-transform:uppercase;padding:.35rem 1rem;border-radius:999px;
    margin-bottom:1.25rem;
  }
  .hero-title{font-size:clamp(2rem,5vw,3.5rem);font-weight:800;line-height:1.1;margin-bottom:1rem}
  .hero-title span{
    background:linear-gradient(90deg,#60a5fa,#818cf8,#c084fc);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  .hero-sub{font-size:1.1rem;color:var(--muted);max-width:520px;line-height:1.7;margin-bottom:2.5rem}
  .hero-cta{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;border:none;padding:1rem 2.5rem;border-radius:999px;
    font-size:1.1rem;font-weight:700;cursor:pointer;
    transition:transform .2s,box-shadow .2s;
    box-shadow:0 8px 30px rgba(59,130,246,.4);
  }
  .hero-cta:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(59,130,246,.5)}
  .hero-stats{display:flex;gap:2rem;margin-top:3rem;flex-wrap:wrap;justify-content:center}
  .stat{text-align:center}
  .stat-num{font-size:1.75rem;font-weight:800;color:var(--gold)}
  .stat-label{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}

  /* CHAT */
  #chat-wrapper{display:none;flex-direction:column;min-height:100vh;max-width:780px;margin:0 auto}
  .chat-header{
    position:sticky;top:0;z-index:100;
    background:rgba(10,14,26,.9);backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);
    padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem;
  }
  .chat-avatar{
    width:42px;height:42px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;font-size:1.2rem;
    flex-shrink:0;
  }
  .chat-header-info .name{font-weight:700;font-size:1rem}
  .chat-header-info .status{font-size:.8rem;color:var(--green);display:flex;align-items:center;gap:.4rem}
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 2s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

  #messages{flex:1;padding:1.5rem;display:flex;flex-direction:column;gap:1rem;overflow-y:auto}

  .msg{display:flex;gap:.75rem;animation:fadeUp .3s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .msg.user{flex-direction:row-reverse}
  .msg-avatar{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;margin-top:2px;
    display:flex;align-items:center;justify-content:center;font-size:.95rem;
  }
  .msg.bot .msg-avatar{background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .msg.user .msg-avatar{background:linear-gradient(135deg,#374151,#4b5563)}
  .msg-bubble{
    max-width:75%;padding:.85rem 1.15rem;border-radius:18px;line-height:1.6;
    font-size:.95rem;
  }
  .msg.bot .msg-bubble{
    background:var(--surface2);border:1px solid var(--border);
    border-bottom-left-radius:4px;
  }
  .msg.user .msg-bubble{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;border-bottom-right-radius:4px;
  }
  .msg-bubble p+p{margin-top:.5rem}
  .msg-bubble strong{color:#93c5fd}
  .msg.user .msg-bubble strong{color:#fff}

  /* QUICK REPLIES */
  .quick-replies{display:flex;flex-wrap:wrap;gap:.5rem;padding:.5rem 1.5rem 0}
  .qr{
    background:var(--surface2);border:1px solid var(--border);
    color:var(--text);padding:.5rem 1rem;border-radius:999px;
    font-size:.875rem;cursor:pointer;transition:all .2s;
  }
  .qr:hover{background:var(--accent);border-color:var(--accent);color:#fff}

  /* INPUT */
  .chat-input-area{
    padding:1rem 1.5rem 1.5rem;
    border-top:1px solid var(--border);
    background:rgba(10,14,26,.9);backdrop-filter:blur(20px);
  }
  .search-wrap{position:relative;margin-bottom:.75rem}
  .search-wrap input{
    width:100%;background:var(--surface2);border:1px solid var(--border);
    color:var(--text);padding:.75rem 1rem;border-radius:12px;
    font-size:.9rem;outline:none;
  }
  .search-wrap input:focus{border-color:var(--accent)}
  .search-dropdown{
    position:absolute;bottom:calc(100% + 4px);left:0;right:0;
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    max-height:200px;overflow-y:auto;z-index:200;display:none;
  }
  .search-dropdown.open{display:block}
  .sd-item{padding:.65rem 1rem;cursor:pointer;font-size:.9rem;border-bottom:1px solid var(--border)}
  .sd-item:last-child{border-bottom:none}
  .sd-item:hover{background:var(--surface2)}
  .sd-item em{color:var(--muted);font-style:normal;font-size:.8rem}

  .input-row{display:flex;gap:.5rem}
  .msg-input{
    flex:1;background:var(--surface2);border:1px solid var(--border);
    color:var(--text);padding:.75rem 1rem;border-radius:12px;
    font-size:.95rem;outline:none;resize:none;
  }
  .msg-input:focus{border-color:var(--accent)}
  .send-btn{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;width:46px;height:46px;border-radius:12px;
    cursor:pointer;font-size:1.1rem;flex-shrink:0;transition:opacity .2s;
  }
  .send-btn:hover{opacity:.85}

  /* RESULT CARD */
  .result-card{
    background:var(--card);border:1px solid var(--border);border-radius:16px;
    overflow:hidden;margin-top:.5rem;
  }
  .result-header{
    padding:1rem 1.25rem;font-weight:700;font-size:1rem;
    display:flex;align-items:center;gap:.5rem;
  }
  .result-header.green{background:rgba(16,185,129,.15);color:var(--green);border-bottom:1px solid rgba(16,185,129,.2)}
  .result-header.red{background:rgba(239,68,68,.15);color:var(--red);border-bottom:1px solid rgba(239,68,68,.2)}
  .result-header.yellow{background:rgba(245,158,11,.15);color:var(--gold);border-bottom:1px solid rgba(245,158,11,.2)}
  .result-body{padding:1rem 1.25rem}
  .info-row{display:flex;justify-content:space-between;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--border);font-size:.875rem}
  .info-row:last-child{border-bottom:none}
  .info-row .label{color:var(--muted)}
  .info-row .val{font-weight:600}
  .pill{padding:.2rem .65rem;border-radius:999px;font-size:.8rem;font-weight:700}
  .pill.green{background:rgba(16,185,129,.15);color:var(--green)}
  .pill.red{background:rgba(239,68,68,.15);color:var(--red)}
  .pill.yellow{background:rgba(245,158,11,.15);color:var(--gold)}
  .subject-list{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
  .subj-tag{background:var(--surface2);border:1px solid var(--border);padding:.25rem .65rem;border-radius:8px;font-size:.8rem}

  /* TYPING */
  .typing-indicator{display:flex;gap:4px;align-items:center;padding:.75rem 1rem}
  .typing-indicator span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce .8s infinite}
  .typing-indicator span:nth-child(2){animation-delay:.15s}
  .typing-indicator span:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

  /* PROGRESS */
  .progress-bar{height:3px;background:var(--border);border-radius:999px;margin-bottom:1rem}
  .progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}

  /* RESPONSIVE */
  @media(max-width:480px){
    .msg-bubble{max-width:88%}
    .hero-title{font-size:1.8rem}
    .hero-stats{gap:1.25rem}
  }
</style>
</head>

let state = {
  step:0,
  programme:null,
  entryMode:null,
  utmeScore:null,
  stateName:null,

function setProgress(pct){document.getElementById("prog").style.width=pct+"%"}

function startChat(){
  document.getElementById("hero").style.display="none";
  const cw = document.getElementById("chat-wrapper");
  cw.style.display="flex";
  setTimeout(()=>botMsg("Hey there! 👋 Welcome to the <strong>UNILAG Admission Guide</strong> — powered by official 2025/2026 data.<br/><br/>I'll check your eligibility, O/Level requirements, UTME subjects, and cut-off marks in seconds. Let's go! 🚀"),300);
  setTimeout(()=>askProgramme(),1500);
}

function askProgramme(){
  state.step=1;
  setProgress(20);
  setTimeout(()=>{
    botMsg("What <strong>programme</strong> are you interested in? Use the search box below to find your course 👇");
    showSearch(true);
    showInput(false);
  },400);
}

function showSearch(show){
  document.getElementById("search-wrap").style.display=show?"block":"none";
  if(show){
    document.getElementById("search-input").value="";
    document.getElementById("search-dd").innerHTML="";
    document.getElementById("search-dd").classList.remove("open");
    document.getElementById("search-input").focus();
  }
}
function showInput(show){
  document.getElementById("msg-input").disabled=!show;
  document.getElementById("send-btn") && (document.getElementById("send-btn").style.display=show?"":"none");
  if(show) document.getElementById("msg-input").focus();
}

function filterDropdown(q){
  const dd=document.getElementById("search-dd");
  const matches=PROG_NAMES.filter(p=>p.toLowerCase().includes(q.toLowerCase())).slice(0,12);
  dd.innerHTML=matches.map(p=>`<div class="sd-item" onclick="selectProgramme('${p.replace(/'/g,"\\'")}')"><strong>${p}</strong> <em>— ${PROGRAMMES[p].faculty}</em></div>`).join("");
  dd.classList.toggle("open",matches.length>0&&q.length>0);
}

function selectProgramme(prog){
  state.programme=prog;
  showSearch(false);
  document.getElementById("search-dd").classList.remove("open");
  userMsg(prog);
  setTimeout(()=>askEntryMode(),600);
}

function askEntryMode(){
  state.step=2;
  setProgress(40);
  botMsg(`Great choice — <strong>${state.programme}</strong> (Faculty of ${PROGRAMMES[state.programme].faculty}). 🎯<br/><br/>How are you applying?`);
  showQuickReplies(["UTME (JAMB)","Direct Entry (DE)"]);
}

function askUTMEScore(){
  state.step=3;
  setProgress(60);
  clearQuickReplies();
  botMsg("What's your <strong>UTME (JAMB) score</strong>? Type the number below.");
  showInput(true);
  document.getElementById("msg-input").placeholder="e.g. 275";
}

function askState(){
  state.step=4;
  setProgress(80);
  showInput(false);
  botMsg("What's your <strong>state of origin</strong>? (This determines your catchment area cut-off)");
  showQuickReplies(STATES);
}

function computeResult(){
  state.step=5;
  setProgress(100);
  clearQuickReplies();
  showInput(false);

  const p=PROGRAMMES[state.programme];
  const catchment=CATCHMENT_2025[state.programme]||{};
  const meritCut=p.utme2025;
  const score=state.utmeScore;
  const stateName=state.stateName;
  const catchCut=catchment[stateName];

  // Determine eligibility
  let eligible="unknown";
  let cutUsed=null;
  let cutLabel="";

  if(score!==null && meritCut!==null){
    if(score>=meritCut){
      eligible="merit";cutUsed=meritCut;cutLabel="Merit";
    } else if(catchCut!==undefined && score>=catchCut){
      eligible="catchment";cutUsed=catchCut;cutLabel=`Catchment (${stateName})`;
    } else if(catchCut===undefined && (stateName==="Outside Southwest"||stateName==="Other (Southwest)")){
      eligible=score>=meritCut?"merit":"below";cutUsed=meritCut;cutLabel="Merit (no catchment for your state)";
    } else {
      eligible="below";
    }
  }

  let cardClass="yellow",icon="⚠️",headerText="Let me show you the full picture";
  if(eligible==="merit"){cardClass="green";icon="✅";headerText="You likely qualify — Great news!"}
  if(eligible==="catchment"){cardClass="green";icon="✅";headerText="You may qualify via Catchment!"}
  if(eligible==="below"){cardClass="red";icon="❌";headerText="Below cut-off — Here's what you need"}

  const scoreDisplay=score!==null?score:"—";
  const meritDisplay=meritCut!==null?meritCut:"N/A";
  const catchDisplay=catchCut!==undefined?catchCut:(meritCut?"See Merit cut":"N/A");

  const card=`
<div class="result-card">
  <div class="result-header ${cardClass}">${icon} ${headerText}</div>
  <div class="result-body">
    <div class="info-row"><span class="label">Programme</span><span class="val">${state.programme}</span></div>
    <div class="info-row"><span class="label">Faculty</span><span class="val">${p.faculty}</span></div>
    <div class="info-row"><span class="label">Entry Mode</span><span class="val">${state.entryMode}</span></div>
    ${score!==null?`<div class="info-row"><span class="label">Your UTME Score</span><span class="val">${scoreDisplay}</span></div>`:""}
    <div class="info-row"><span class="label">Merit Cut-Off (2025/26)</span><span class="val ${meritCut&&score>=meritCut?"":""}"><span class="pill ${score!==null&&meritCut!==null&&score>=meritCut?"green":"red"}">${meritDisplay}</span></span></div>
    ${catchCut!==undefined?`<div class="info-row"><span class="label">Catchment Cut-Off (${stateName})</span><span class="val"><span class="pill ${score!==null&&score>=catchCut?"green":"red"}">${catchDisplay}</span></span></div>`:""}
    ${p.note?`<div class="info-row"><span class="label">Special Note</span><span class="val" style="color:var(--gold)">${p.note}</span></div>`:""}
  </div>
</div>`;

  const subjectsCard=`
<div class="result-card" style="margin-top:.5rem">
  <div class="result-header yellow">📚 Requirements Checklist</div>
  <div class="result-body">
    <div style="margin-bottom:.75rem">
      <div class="label" style="font-size:.8rem;margin-bottom:.4rem">UTME SUBJECTS NEEDED</div>
      <div class="subject-list">
        ${p.utmeSubjects.map(s=>`<span class="subj-tag">📌 ${s}</span>`).join("")}
      </div>
    </div>
    <div>
      <div class="label" style="font-size:.8rem;margin-bottom:.4rem">O/LEVEL (WAEC/NECO)</div>
      <div style="font-size:.875rem;line-height:1.6">${p.olevel}</div>
    </div>
  </div>
</div>`;

  setTimeout(()=>{
    if(state.entryMode==="UTME (JAMB)"){
      botMsgHTML(card+subjectsCard);
      setTimeout(()=>{
        let advice="";
        if(eligible==="merit") advice="🎉 Your score clears the <strong>merit cut-off</strong>! Make sure your O/Level and UTME subjects match the requirements above, then check your JAMB CAPS portal.";
        else if(eligible==="catchment") advice=`🎊 Your score is below the national merit cut but <strong>clears the catchment cut-off</strong> for <strong>${stateName}</strong>. Ensure you listed UNILAG as your institution in JAMB and you truly belong to that catchment state.`;
        else if(eligible==="below") advice=`📉 Your score of <strong>${score}</strong> is below both the merit cut-off (<strong>${meritDisplay}</strong>)${catchCut!==undefined?` and the catchment cut-off (<strong>${catchDisplay}</strong>)`:""}. You may consider boosting your score or exploring programmes with lower cut-offs. Want me to check another course?`;
        else advice="📋 I couldn't fully determine your eligibility — please verify your score and state, then try again.";
        botMsg(advice);
        setTimeout(()=>showRestartOption(),800);
      },900);
    } else {
      // Direct Entry
      botMsg(`📋 For <strong>Direct Entry</strong> into <strong>${state.programme}</strong>, you need valid JUPEB/A-Level passes or equivalent qualifications.<br/><br/><strong>⚠️ Note:</strong> All DE candidates must still satisfy all O/Level requirements.`);
      botMsgHTML(subjectsCard);
      setTimeout(()=>showRestartOption(),600);
    }
  },500);
}

function showRestartOption(){
  showQuickReplies(["Check another programme","See all faculties"]);
}

/* ============================================================
   QUICK REPLIES & INPUT HANDLING
   ============================================================ */

function showQuickReplies(arr){
  const area=document.getElementById("quick-area");
  area.innerHTML=`<div class="quick-replies">${arr.map(r=>`<button class="qr" onclick="handleQR('${r.replace(/'/g,"\\'")}')">  ${r}</button>`).join("")}</div>`;
}
function clearQuickReplies(){document.getElementById("quick-area").innerHTML=""}

function handleQR(val){
  clearQuickReplies();
  userMsg(val);
  if(val==="UTME (JAMB)"||val==="Direct Entry (DE)"){
    state.entryMode=val;
    if(val==="UTME (JAMB)") askUTMEScore();
    else{
      // DE flow — skip score
      state.utmeScore=null;
      askState();
    }
  } else if(STATES.includes(val)){
    state.stateName=val;
    computeResult();
  } else if(val==="Check another programme"){
    resetChat();
  } else if(val==="See all faculties"){
    showFacultySummary();
  }
}

function sendMsg(){
  const inp=document.getElementById("msg-input");
  const val=inp.value.trim();
  if(!val)return;
  inp.value="";

  if(state.step===3){
    const num=parseFloat(val);
    if(isNaN(num)||num<0||num>400){botMsg("Please enter a valid UTME score between 0 and 400.");return;}
    state.utmeScore=num;
    userMsg(val);
    showInput(false);
    askState();
  }
}

function userMsg(text){
  appendMsg("user","👤",text);
}
function botMsg(html){
  showTyping();
  setTimeout(()=>{
    removeTyping();
    appendMsg("bot","🎓",html);
  },600);
}
function botMsgHTML(html){
  removeTyping();
  const msgs=document.getElementById("messages");
  const wrap=document.createElement("div");
  wrap.className="msg bot";
  wrap.style.animation="fadeUp .3s ease";
  wrap.innerHTML=`<div class="msg-avatar">🎓</div><div style="flex:1">${html}</div>`;
  msgs.appendChild(wrap);
  msgs.scrollTop=msgs.scrollHeight;
}

function appendMsg(type,avatar,html){
  const msgs=document.getElementById("messages");
  const div=document.createElement("div");
  div.className=`msg ${type}`;
  div.innerHTML=`<div class="msg-avatar">${avatar}</div><div class="msg-bubble"><p>${html}</p></div>`;
  msgs.appendChild(div);
  msgs.scrollTop=msgs.scrollHeight;
}

function showTyping(){
  const msgs=document.getElementById("messages");
  const t=document.createElement("div");
  t.className="msg bot";t.id="typing";
  t.innerHTML=`<div class="msg-avatar">🎓</div><div class="msg-bubble typing-indicator"><span></span><span></span><span></span></div>`;
  msgs.appendChild(t);
  msgs.scrollTop=msgs.scrollHeight;
}
function removeTyping(){const t=document.getElementById("typing");if(t)t.remove();}

function resetChat(){
  state={step:0,programme:null,entryMode:null,utmeScore:null,stateName:null};
  clearQuickReplies();
  showSearch(false);
  showInput(false);
  setProgress(0);
  botMsg("Sure! Let's start fresh 🔄");
  setTimeout(()=>askProgramme(),700);
}

function showFacultySummary(){
  const facs=[...new Set(Object.values(PROGRAMMES).map(p=>p.faculty))].sort();
  const html=`<div class="result-card">
  <div class="result-header yellow">🏛️ UNILAG Faculties (2025/2026)</div>
  <div class="result-body">
    ${facs.map(f=>{
      const progs=Object.keys(PROGRAMMES).filter(k=>PROGRAMMES[k].faculty===f);
      return `<div class="info-row" style="flex-direction:column;align-items:flex-start;gap:.35rem">
        <span style="font-weight:700;color:var(--accent)">${f}</span>
        <div class="subject-list">${progs.map(p=>`<span class="subj-tag">${p}</span>`).join("")}</div>
      </div>`;
    }).join("")}
  </div></div>`;
  botMsgHTML(html);
  setTimeout(()=>showRestartOption(),600);
}

// Close dropdown when clicking outside
document.addEventListener("click",function(e){
  if(!e.target.closest("#search-wrap"))
    document.getElementById("search-dd").classList.remove("open");
});
</script>
</body>
</html>
